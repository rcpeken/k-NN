pluginManagement {
    repositories {
        maven { url "https://ci.opensearch.org/maven2/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'opensearch-knn'

include ":qa"
include ":qa:rolling-upgrade"
include ":qa:restart-upgrade"
include ":remote-index-build-client"

// Opt-in: excluded from default and release builds.
if (startParameter.projectProperties['knn.sandbox.enabled'] == 'true') {
    include ":sandbox"
}

